;METADATA=(Diff=true, UseCommands=true)
[CommonSettings]
ModulesToPreload=PropPioneer
SourcePath=Mods/GameFeatures/PropPioneer/Content/Localization/PropPioneer
DestinationPath=Mods/GameFeatures/PropPioneer/Content/Localization/PropPioneer
